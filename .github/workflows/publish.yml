# Publishes the extension to the Visual Studio Marketplace when a push to main carries a version
# that is not on the Marketplace yet. Uses Trusted Publishing (OIDC), so no access token is stored.
# The publisher's Trusted Publishing policy must name this repository and the workflow file publish.yml.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:unit

      - name: Compare with the version on the Marketplace
        id: version
        run: |
          id=$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")
          local_version=$(node -p "require('./package.json').version")
          published=$(npx vsce show "$id" --json 2>/dev/null \
            | node -e "let s = ''; process.stdin.on('data', d => s += d).on('end', () => { try { console.log(JSON.parse(s).versions[0].version); } catch { console.log(''); } })")
          echo "$id: local $local_version, Marketplace ${published:-none}"
          if [ "$local_version" = "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $local_version is already on the Marketplace; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with Trusted Publishing
        if: steps.version.outputs.publish == 'true'
        run: npx vsce publish --oidc
